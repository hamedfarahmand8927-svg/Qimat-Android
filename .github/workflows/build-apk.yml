name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.hamigallery --project-name qimat .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Qimat_v1.2.2_Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qimat-v1.2.2-Android-APK
          path: Qimat_v1.2.2_Android.apk
          if-no-files-found: error
          retention-days: 30
