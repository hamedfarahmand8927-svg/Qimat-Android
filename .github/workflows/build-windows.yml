name: Build Windows 7 package

on:
  push:
    branches: [qimat-windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          # خروجی 32 بیتی روی Windows 7/8/10/11 هر دو معماری 32 و 64 بیت اجرا می‌شود.
          architecture: 'x86'
      - name: Install build tools
        shell: powershell
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install PyQt5==5.14.2 PyInstaller==4.10
          choco install nsis --yes --no-progress
      - name: Build standalone executable
        shell: powershell
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Qimat_v1_2_2_Windows7Plus main.py
      - name: Build installer
        shell: powershell
        run: makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: Qimat-v1.2.2-Windows7Plus
          path: |
            windows-desktop/dist/Qimat_v1_2_2_Windows7Plus.exe
            windows-desktop/dist/Qimat_v1_2_2_Setup_Windows7Plus.exe
          if-no-files-found: error
